<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Memefiy - Share & Discover Memes</title>
    <meta property="og:site_name" content="Memefiy">
    <meta property="og:title" content="Memefiy - Share & Discover Memes">
    <meta name="application-name" content="Memefiy">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="x6rcLIyzzjZbR16thiHotGIjwaiktNe6EAb9VrWVz9g" />
    
    <!-- Dynamic Flask Static CSS Path -->
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Edu+NSW+ACT+Cursive:wght@400..700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <link rel="stylesheet" href="/static/css/main.css">

    {% block head %}{% endblock %}
</head>

<body>

    <nav class="navbar bg-black sticky-top" id="nav">
        <div class="container-fluid d-flex justify-content-between align-items-center flex-wrap">
            <a href="{{ url_for('home.index') }}" class="navbar-brand m-0" id="logo">Memefiy</a>
            
            <!-- Desktop Search Bar (Hidden on Mobile) -->
            <form action="{{url_for('home.index')}}" method="GET" class="d-none d-md-flex">
                <input type="search" placeholder="Search Memes..." class="form-control mt-3 mb-2" name="srch" value="{{ srch or '' }}">
                <button class="btn h-25 mt-3 mx-1" style="background-color: #FFF000;"><i class="fa-solid fa-magnifying-glass"></i></button>
            </form>

            <!-- Kept original nav links & CSS styles -->
            <div class="d-flex align-items-center">
                <a href="{{ url_for('home.index') }}" class="nav-link mx-2 mx-sm-3 d-flex align-items-center" title="Home">
                <div class="nav-btn">
                    <i class="fa-solid fa-house"></i>
                    <span class="d-none d-md-inline ms-1">Home</span>
                </div>
                </a>

                <!-- Mobile Search Toggle Icon (Placed directly after Home) -->
                <button class="btn d-md-none p-0 mx-2 text-white border-0" type="button" data-bs-toggle="collapse" data-bs-target="#mobileSearchForm" aria-expanded="false" aria-controls="mobileSearchForm" title="Search">
                    <div class="nav-btn">
                        <i class="fa-solid fa-magnifying-glass fs-5" style="color: #FFF000;"></i>
                    </div>
                </button>

                <a href="{{ url_for('home.upload') }}" class="nav-link mx-2 mx-sm-3 d-flex align-items-center" title="Upload">
                <div class="nav-btn">
                    <i class="fa-solid fa-plus"></i>
                    <span class="d-none d-md-inline ms-1">Upload</span>
                </div>
                </a>
                <a href="{{ url_for('home.about') }}" class="nav-link mx-2 mx-sm-3 d-flex align-items-center" title="About">
                <div class="nav-btn">
                    <i class="fa-solid fa-circle-info"></i>
                    <span class="d-none d-md-inline ms-1">About</span>
                </div>
                </a>
            </div>

            <!-- Collapsible Mobile Search Input (Toggles below on click) -->
            <div class="collapse w-100 mt-2 d-md-none" id="mobileSearchForm">
                <form action="{{url_for('home.index')}}" method="GET" class="d-flex justify-content-center">
                    <input type="search" placeholder="Search Memes..." class="form-control me-1" name="srch" value="{{ srch or '' }}">
                    <button class="btn" style="background-color: #FFF000;"><i class="fa-solid fa-magnifying-glass"></i></button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Flash Alert Messages -->
    {% with messages = get_flashed_messages(with_categories=True) %}
        {% if messages %}
            <div class="container mt-3">
                {% for category, msg in messages %}
                <div class="alert alert-{{ category }} alert-dismissible fade show d-flex align-items-center justify-content-between" role="alert">
                    <strong>{{ msg }}</strong>
                    <button type="button" class="btn p-0 border-0" data-bs-dismiss="alert" aria-label="Close">
                        <i class="fa-regular fa-circle-xmark fs-4"></i>
                    </button>
                </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <!-- Main Page Content Block -->
    {% block content %}{% endblock %}

    <footer class="text-secondary text-center mt-5 mb-3">
        <p class="m-0">2026 © Memefiy</p>
    </footer>

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DGF37PWR2Y"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-DGF37PWR2Y');
    </script>
</body>
</html>
